<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 98" width="1200" height="98" aria-hidden="true"><style><![CDATA[
  /* 단독 실행 — 파일 하나만 열어도 된다. 인터넷이 없으면 맑은 고딕·Consolas로 보인다 */
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }


  /* 스틸 테마 — 운영 화면(shared/themes.css `steel`)과 같은 값: 중성 다크 그레이 + 브랜드 옐로 (2026-10-27) */
  :root {
    --bg:        #0e0f11;
    --surface:   #191b1f;
    --surface-2: #23262b;
    --surface-3: #121316;
    --border:    #32363d;
    --border-2:  #474d57;
    --accent:    #ffd400;
    --accent-fg: #1a1400;
    --text:      #f0f2f5;
    --text-2:    #bcc1c9;
    --text-3:    #8b919b;
    --team:      #4a8ae8;
    --auto:      #4ac97a;
    --impl:      #ff8fa3;
    --red:       #ec4f62;
    --ui:   "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --inset: inset 0 1px 2px rgba(0,0,0,.45);
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--ui); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }

  /* ---- 배너 ---- */
  .banner { background: var(--accent); color: var(--accent-fg); border-bottom: 4px solid var(--accent-fg); padding: 16px 0 14px; }
  .banner-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .banner .name { font-size: 26px; font-weight: 900; line-height: 1.15; }
  .banner .role { font-size: 16px; font-weight: 700; padding-left: 16px; border-left: 2px solid rgba(26,20,0,.35); }
  .banner .stamp { margin-left: auto; font-family: var(--mono); font-size: 16px; font-weight: 600; opacity: .85; }

  /* ---- 단계 막대 (위) ---- */
  .rail { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .rail-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
  .rail button {
    flex: none; min-width: 44px; height: 40px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    font-family: var(--ui); font-size: 16px; font-weight: 700; color: var(--text-2);
    background: var(--surface-3); border: 1px solid var(--border-2);
  }
  .rail button:hover { color: var(--text); border-color: var(--text-3); }
  .rail button.impl { border-color: #8a4757; }
  .rail button[aria-current="step"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .rail button:focus-visible, .nav button:focus-visible, .toc a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 페이지 ---- */
  main { max-width: 1240px; margin: 0 auto; padding: 22px 16px 120px; }
  .page { animation: page-in .18s ease-out; }
  @keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .ph { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .no {
    flex: none; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; background: var(--team); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.5);
  }
  .no.auto { background: var(--auto); color: #0b2a1f; }
  .no.misc { background: var(--surface-2); color: var(--accent); border: 2px solid var(--accent); font-size: 24px; }
  .ph h2 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.2; }
  .ph .when { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--accent); background: var(--surface-3);
              border: 1px solid #8a7400; border-radius: 999px; padding: 2px 12px; }
  .ph .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .lead { font-size: 19px; color: var(--text-2); margin: 10px 0 18px; max-width: 80ch; }
  .lead b { color: var(--text); }

  .tag { font-size: 16px; font-weight: 700; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--text-2); background: var(--surface-3); }
  .tag.ok   { color: var(--auto); border-color: #2c7a52; }
  .tag.soon { color: #7fb0ff; border-color: #2a4a7a; }
  .tag.open { color: var(--accent); border-color: #8a7400; }
  .tag.impl { color: #2a0b14; background: var(--impl); border-color: var(--impl); }
  .tag.impl.opt { color: var(--impl); background: var(--surface-3); }
  /* 확정·잠정·임시·예정 뱃지와 「선택」 설명은 숨긴다 (2026-10-21 사용자 지정) — 지우지 않고 class="st-hide"만 붙였다 */
  .st-hide { display: none !important; }

  .grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; min-width: 0; }
  .card + .card { margin-top: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 .t { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--accent); }
  .card p { margin: 0 0 10px; color: var(--text-2); }
  .card p:last-child { margin-bottom: 0; }
  ul.dots, ol.steps { margin: 0; padding-left: 22px; color: var(--text-2); }
  ul.dots li, ol.steps li { margin: 5px 0; }
  li b, p b, td b { color: var(--text); }
  code { font-family: var(--mono); font-size: .92em; color: var(--accent); background: var(--surface-3); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; overflow-wrap: anywhere; }

  pre.code {
    margin: 0; padding: 12px 14px; border-radius: 4px; overflow-x: auto;
    background: var(--surface-3); border: 1px solid var(--border); box-shadow: var(--inset);
    font-family: var(--mono); font-size: 16px; line-height: 1.5; color: var(--text); white-space: pre;
  }
  pre.code + pre.code, .label + pre.code { margin-top: 8px; }
  pre.code .k { color: #9fb4ff; }      /* 키 */
  pre.code .s { color: var(--accent); } /* 문자열 */
  pre.code .n { color: var(--auto); }  /* 숫자·true·null */
  pre.code .c { color: var(--text-3); } /* 주석 */
  pre.code .m { color: var(--impl); font-weight: 700; }  /* 메서드 */
  .label { margin-top: 12px; font-size: 16px; font-weight: 700; color: var(--text-3); }
  .label:first-child { margin-top: 0; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th, td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { background: var(--surface-2); color: var(--text); font-weight: 700; white-space: nowrap; }
  td { color: var(--text-2); background: var(--surface); }
  tr:last-child td { border-bottom: none; }
  td.k { white-space: nowrap; color: var(--text); font-weight: 700; }

  .note { margin-top: 14px; padding: 10px 14px; border-radius: 4px; background: var(--surface-3); border: 1px solid var(--border);
          border-left: 4px solid var(--accent); color: var(--text-2); }
  .note.red { border-left-color: var(--red); }
  .note b { color: var(--text); }

  /* ---- 표지 ---- */
  .toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin: 14px 0 18px; }
  .toc a {
    display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 8px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
  }
  .toc a:hover { border-color: var(--accent); }
  .toc a.impl { border-left: 4px solid var(--impl); }
  .toc .n { flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; background: var(--team); color: #fff; }
  .toc .n.auto { background: var(--auto); color: #0b2a1f; }
  .toc .n.misc { background: var(--surface-2); color: var(--accent); border: 1px solid var(--accent); }
  .toc b { display: block; font-size: 17px; }
  .toc small { display: block; font-size: 16px; color: var(--text-3); font-family: var(--mono); overflow-wrap: anywhere; }

  /* ---- 섹터 그림 ---- */
  .field { display: grid; grid-template-columns: .5fr 1fr .75fr 1fr .5fr; grid-template-rows: repeat(3, 46px); gap: 4px;
           max-width: 560px; font-family: var(--mono); font-size: 16px; font-weight: 700; }
  .field > div { display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid var(--border-2); }
  .field .edge { grid-row: 1 / 4; color: var(--text-3); font-family: var(--ui); font-weight: 500;
                 background: repeating-linear-gradient(135deg, var(--surface-3) 0 8px, var(--surface) 8px 16px); }
  .field .b { background: #16233a; border-color: var(--team); color: #b9c6ff; }
  .field .r { background: #4a1f2e; border-color: var(--red); color: #ffc2cc; }
  .field .cm { grid-row: 1 / 4; grid-column: 3; background: var(--surface-2); color: var(--accent); }

  /* ---- 한눈에 보기 그림 (2026-10-21) — 단계별 주고받기 순서도(SVG). 글자는 16px 아래로 줄지 않게 좁은 화면에서는 가로로 밀어 본다 ---- */
  .sec-h { margin: 22px 0 8px; font-size: 20px; font-weight: 800; }
  figure.dg { margin: 0 0 6px; }
  .dg-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-3); }
  .dg-wrap svg { display: block; width: 100%; min-width: 1200px; height: auto; }
  .dg-wrap text { fill: var(--text); font-family: var(--ui); font-size: 16px; }
  .dg-wrap .dg-t { font-size: 18px; font-weight: 800; }
  .dg-wrap .dg-s { fill: var(--text-2); }
  .dg-wrap .dg-m { fill: var(--accent); font-family: var(--mono); }
  .dg-wrap .dg-l { fill: var(--text-2); font-weight: 700; }
  .dg-wrap .dg-l.impl { fill: var(--impl); }
  .dg-wrap .dg-l.auto { fill: var(--auto); }
  .dg-box { fill: var(--surface); stroke: var(--border-2); stroke-width: 1.5; }
  .dg-box.srv { stroke: var(--accent); stroke-width: 2; }
  .dg-box.impl { stroke: var(--impl); stroke-width: 2; }
  .dg-box.auto { stroke: var(--auto); stroke-width: 2; }
  .dg-group { fill: none; stroke: var(--text-3); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .dg-line { fill: none; stroke: var(--text-2); stroke-width: 2; }
  .dg-line.impl { stroke: var(--impl); }
  .dg-line.auto { stroke: var(--auto); }
  .dg-head { fill: var(--text-2); }
  .dg-head.impl { fill: var(--impl); }
  .dg-head.auto { fill: var(--auto); }
  figure.dg figcaption { margin-top: 8px; color: var(--text-2); }
  figure.dg figcaption b { color: var(--text); }

  .sq-band { fill: var(--surface); }
  .sq-band.alt { fill: #16181c; }
  .sq-life { stroke: var(--border-2); stroke-width: 1.5; stroke-dasharray: 4 6; }
  .dg-line.sq-resp { stroke-dasharray: 7 5; }
  .dg-wrap .dg-m.sq-impl { fill: var(--impl); }
  .dg-wrap .dg-m.sq-auto { fill: var(--auto); }
  .sq-no { fill: var(--team); }
  .sq-no.auto { fill: var(--auto); }
  .dg-wrap .sq-no-t { fill: #fff; font-weight: 900; }
  .dg-wrap .sq-no-t.auto { fill: #0b2a1f; }
  .sq-step { cursor: pointer; }
  /* 칸 이름 줄은 스크롤해도 단계 막대 밑에 붙어 있다 (2026-10-21 사용자 지정). 그림 상자가 가로 스크롤이면 sticky가 그 상자에 갇히므로
     그림이 다 들어가는 넓은 화면에서는 상자의 가로 스크롤을 끈다 — 좁은 화면은 머리가 붙지 않고 상자 안에서 밀어 본다 */
  .sq-head { position: sticky; top: var(--rail-h, 61px); z-index: 2; border-bottom: 1px solid var(--border); }
  .sq-head-bg { fill: var(--surface-3); }
  @media (min-width: 1240px) { .dg-wrap { overflow: visible; } }
  .dg-line.laser { stroke: var(--red); stroke-width: 2.5; }
  .dg-head.laser { fill: var(--red); }
  .dg-wrap .dg-l.laser { fill: #ff8a9b; }
  .sq-note { fill: var(--surface-2); stroke: var(--border-2); stroke-width: 1.5; }
  .dg-wrap .sq-note-t { fill: var(--text); }
  .sq-phase { fill: var(--surface-2); }
  .dg-wrap .sq-ph-t { fill: var(--accent); font-size: 18px; font-weight: 900; }
  .dg-wrap .sq-when { fill: var(--accent); font-weight: 600; }
  .sq-hit { fill: transparent; }
  .sq-step:hover .sq-hit, .sq-step:focus-visible .sq-hit { fill: var(--surface-2); stroke: var(--accent); }

  /* ---- 아래 넘김 막대 ---- */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(14,15,17,.96); border-top: 1px solid var(--border); }
  .nav-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .nav button {
    height: 46px; padding: 0 20px; border-radius: 6px; cursor: pointer; font-family: var(--ui); font-size: 17px; font-weight: 800;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border-2);
  }
  .nav button.next { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .nav button:disabled { opacity: .4; cursor: default; }
  .nav .where { flex: 1; text-align: center; color: var(--text-2); font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .where b { color: var(--text); }
  .nav .keys { color: var(--text-3); }
  .foot { margin-top: 30px; font-size: 16px; color: var(--text-3); border-top: 1px solid var(--border); padding-top: 12px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .ph h2 { font-size: 24px; }
    .no { width: 52px; height: 52px; font-size: 24px; }
    .nav .keys { display: none; }
  }
  @media (max-width: 520px) {
    .banner .stamp { margin-left: 0; }
    .nav button { padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .page { animation: none; } }
  /* 인쇄하면 모든 페이지를 차례로 */
  @media print {
    .rail, .nav { display: none !important; }
    .page { display: block !important; break-after: page; animation: none; }
    main { padding-bottom: 0; }
  }
]]></style>
              <rect class="sq-head-bg" x="0" y="0" width="1200" height="98"></rect>
              <rect class="dg-group" x="742" y="4" width="454" height="92" rx="8"></rect>
              <text class="dg-l" x="756" y="24">UGV — 팀이 가져가 쓰는 기체</text>
              <rect class="dg-box" x="215" y="30" width="170" height="56" rx="6"></rect>
              <text class="dg-t" x="300" y="53" text-anchor="middle">경기장 장치</text>
              <text class="dg-s" x="300" y="76" text-anchor="middle">카메라·표적·거점</text>
              <rect class="dg-box srv" x="420" y="30" width="200" height="56" rx="6"></rect>
              <text class="dg-t" x="520" y="53" text-anchor="middle">경기운영 서버</text>
              <text class="dg-s" x="520" y="76" text-anchor="middle">대시보드 · /api/report/</text>
              <rect class="dg-box impl" x="760" y="30" width="200" height="56" rx="6"></rect>
              <text class="dg-t" x="860" y="53" text-anchor="middle">참가팀 프로그램</text>
              <text class="dg-s" x="860" y="76" text-anchor="middle">team_node.py (젯슨)</text>
              <rect class="dg-box auto" x="1014" y="30" width="172" height="56" rx="6"></rect>
              <text class="dg-t" x="1100" y="53" text-anchor="middle">주최측 장치</text>
              <text class="dg-s" x="1100" y="76" text-anchor="middle">경기 노드 · ESP</text>
              <line class="sq-life" x1="300" y1="86" x2="300" y2="98"></line>
              <line class="sq-life" x1="520" y1="86" x2="520" y2="98"></line>
              <line class="sq-life" x1="860" y1="86" x2="860" y2="98"></line>
              <line class="sq-life" x1="1100" y1="86" x2="1100" y2="98"></line>
            </svg>
