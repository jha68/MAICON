total_minutes: 90
finalize_minutes: 20
time_management:
  upload_minutes: 5
  retrieval_seconds: 120
  pack_seconds: 60
  minimum_upgrade_seconds: 120
data_root: competition
output_root: competition-runs
cpu_workers: 1
cpu_threads: 2
gpu_cpu_threads: 4
seed: 42
runpod:
  enabled: true
  gpu_count: 3
  gpu_priorities:
  - NVIDIA A100-SXM4-80GB
  - NVIDIA A100 80GB PCIe
  cloud_type: SECURE
  max_gpu_hourly_usd: 8.0
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
  ssh_key_path: /config/.ssh/runpod_codex_ed25519
  container_disk_gb: 60
  setup_timeout_seconds: 420
  lease_minutes: 100
  extra_packages:
  - catboost
  existing_pod_id: vvpxznt3e1lvyn
notebooks:
  execute: true
  embed_models: true
  mode: restore
  max_embedded_mb: 200
  compact_export: true
tasks:
- name: q1
  kind: custom
  adapter: custom_adapters.competition:solve
  resource: gpu
  train_csv: q1/data/train.csv
  test_csv: q1/data/test.csv
  sample_submission: q1/sample_submission.csv
  notebook: q1/레이더 시계열 데이터 기반 이동 표적 식별하기.ipynb
  id_column: sample_id
  target: label
  prediction_columns:
  - label
  metric: accuracy
  baseline_seconds: 600
  upgrade_seconds: 1500
  improve: true
  depends_on: []
- name: q2
  kind: custom
  adapter: custom_adapters.competition:solve
  resource: cpu
  train_csv: q2/data/train.csv
  test_csv: q2/data/test.csv
  sample_submission: q2/sample_submission.csv
  notebook: q2/군 장비 정비 보고서 분석을 통한 고장 유형 분류하기.ipynb
  id_column: id
  target: fault_type
  prediction_columns:
  - fault_type
  metric: macro_f1
  baseline_seconds: 600
  upgrade_seconds: 1500
  improve: false
  depends_on: []
