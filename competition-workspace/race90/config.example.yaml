# 경로는 data_root 기준입니다. 실제 지문과 sample_submission을 보고 수정하세요.
# 예상 온라인 제출 환경은 submission-environment.json 참고 (Python 3.9.7, torch 1.10 CPU).
# 로컬/Runpod 하네스 실행 환경과 구분하며, 최종 Notebook의 온라인 호환성은 별도 검증합니다.
total_minutes: 90
finalize_minutes: 20  # 70분부터 결과 회수·제공 Notebook 완성·업로드 준비
time_management:
  upload_minutes: 5  # 85분까지 로컬 제출본 완성, 마지막 5분은 온라인 반영·업로드·접수 확인
  retrieval_seconds: 120  # 70~72분: 원격 결과 회수와 자원 정리
  pack_seconds: 60  # 84~85분: ZIP 묶기와 무결성 검사
  minimum_upgrade_seconds: 120  # 남은 단계 예산이 이보다 짧으면 새 개선 학습 생략
data_root: data
output_root: runs
cpu_workers: 1  # 작은 로컬 CPU에서 대형 데이터 3개를 동시에 펼치지 않음
cpu_threads: 2  # 실제 CPU affinity / 컨테이너 quota 이하로 자동 제한
gpu_cpu_threads: 4
seed: 42

runpod:
  enabled: true
  gpu_count: 3
  gpu_priorities:
    - NVIDIA A100-SXM4-80GB
    - NVIDIA A100 80GB PCIe
  cloud_type: SECURE
  max_gpu_hourly_usd: 8.0  # 3장 합계의 GPU 시간당 상한. 스토리지 요금은 별도.
  image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404  # 실제 A100 Pod에서 검증한 이미지
  ssh_key_path: ~/.ssh/id_ed25519
  container_disk_gb: 60
  setup_timeout_seconds: 420
  lease_minutes: 100
  extra_packages: []  # custom GPU 어댑터에 필요한 추가 패키지
  # existing_pod_id: 이미_준비된_Pod_ID
  # template_id: 검증한_PyTorch_템플릿_ID
  # network_volume_id: 미리_만든_공유_볼륨_ID
  # data_center_id: 볼륨과_같은_데이터센터

notebooks:
  execute: true
  embed_models: true  # 모든 문항의 가벼운 실행본 확보 후, 시간 안에 가능하면 모델 추가
  mode: restore  # restore: 저장된 실제 예측 복원, infer: 저장 모델로 CPU 재추론
  max_embedded_mb: 200

tasks:
  - name: q1
    kind: timeseries
    resource: gpu
    train_csv: q1/train.csv
    test_csv: q1/test.csv
    sample_submission: q1/sample_submission.csv
    notebook: q1/problem.ipynb
    id_column: sample_id
    target: label
    prediction_columns: [label]
    sensor_columns: [acc_x, acc_y, acc_z]
    time_column: timestamp
    metric: macro_f1
    split:
      strategy: group
      group_column: subject_id
      fraction: 0.2
    baseline_seconds: 120  # GPU 준비와 동시에 실행하는 비상 제출본; GPU 시작을 막지 않음
    upgrade_seconds: 2400
    epochs: 30
    batch_size: 128
    sequence_length: 256
    depends_on: []

  - name: q2
    kind: image
    train_csv: q2/train.csv
    test_csv: q2/test.csv
    sample_submission: q2/sample_submission.csv
    notebook: q2/problem.ipynb
    image_root: q2/images
    image_column: filename
    id_column: id
    target: label
    prediction_columns: [label]
    metric: accuracy
    split: {strategy: stratified, fraction: 0.2}
    baseline_seconds: 120
    upgrade_seconds: 3600
    batch_size: 64
    epochs: 12
    pretrained: true
    freeze_backbone: true
    depends_on: []

  - name: q3
    kind: text
    resource: gpu
    train_csv: q3/train.csv
    test_csv: q3/test.csv
    sample_submission: q3/sample_submission.csv
    notebook: q3/problem.ipynb
    text_columns: [text]
    id_column: id
    target: label
    prediction_columns: [label]
    metric: macro_f1
    split: {strategy: stratified, fraction: 0.2}
    baseline_seconds: 120
    upgrade_seconds: 2400
    model_name: klue/roberta-small
    max_length: 128
    batch_size: 32
    epochs: 3
    depends_on: []

# 세 문항이 같은 데이터를 쓰면 각 문항의 train_csv/test_csv/image_root를
# shared/... 같은 경로로 지정하세요. Runpod 전송은 data_root 전체를 한 번 합니다.
# 선행 문항의 산출물이 필요하면 depends_on: [q1]을 지정하고 아래처럼 연결합니다.
# dependency_features:
#   - task: q1
#     train_file: train_features.csv  # 학습 타깃으로 만든 특징은 OOF 방식 사용
#     test_file: test_features.csv
#     on: id
