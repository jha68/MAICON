[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race90"
version = "0.1.0"
description = "Deadline-aware parallel competition harness for local CPU and Runpod GPUs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "pillow>=10", "PyYAML>=6", "joblib>=1.3", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "torchvision>=0.18", "ultralytics>=8.3", "transformers>=4.46,<6", "safetensors>=0.4", "sentencepiece>=0.2"]
test = ["pytest>=8"]

[project.scripts]
race90 = "race90.cli:main"

[tool.setuptools.packages.find]
include = ["race90*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
